<!DOCTYPE html>

<head>

<title>荣达集团 · 集团简介</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         background:#fafafa; color:#222; line-height:1.7; -webkit-text-size-adjust:100%; }
  .wrap { max-width:480px; margin:0 auto; background:#fff; min-height:100vh; }
  .hero { background:linear-gradient(135deg,#B71C1C,#8e1414); color:#fff; padding:38px 24px 30px; }
  .hero h1 { font-size:25px; letter-spacing:2px; }
  .hero .en { font-size:12px; opacity:.8; margin-top:6px; letter-spacing:3px; }
  .hero .slogan { font-size:14px; margin-top:16px; opacity:.95; }
  .sec { padding:22px 24px; border-bottom:1px solid #f2f2f2; }
  .sec h2 { font-size:16px; color:#B71C1C; margin-bottom:12px; display:flex; align-items:center; font-weight:600; }
  .sec h2::before { content:""; width:4px; height:16px; background:#B71C1C; border-radius:2px; margin-right:9px; display:inline-block; }
  .sec p { font-size:14px; color:#444; }
  .cards { display:flex; gap:10px; flex-wrap:wrap; }
  .card { flex:1; min-width:calc(50% - 5px); background:#faf3f3; border:1px solid #f1e2e2; border-radius:10px; padding:14px 13px; }
  .card h3 { font-size:14px; color:#B71C1C; margin-bottom:6px; }
  .card p { font-size:12.5px; color:#777; }
  .contact .row { display:flex; font-size:14px; padding:9px 0; border-bottom:1px dashed #eee; }
  .contact .row:last-child { border-bottom:none; }
  .contact .label { width:60px; color:#999; flex-shrink:0; }
  .contact .val { color:#222; word-break:break-all; }
  .contact a { color:#B71C1C; text-decoration:none; }
  .foot { padding:20px 24px 34px; font-size:12px; color:#bbb; text-align:center; }
</style>
</head>
<body>
<div class="wrap">

      <div class="card">

      </div>
    </div>
  </div>

  <div class="sec contact">
    <h2>联系我们</h2>
    <div class="row"><span class="label">电话</span><span class="val"><a href="tel:17770014131">17770014131</a></span></div>
    <div class="row"><span class="label">官网</span><span class="val">jxrdxf.top</span></div>
    <div class="row"><span class="label">地址</span><span class="val">江西省南昌市红谷滩区联泰万悦汇20楼</span></div>
